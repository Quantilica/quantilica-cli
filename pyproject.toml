[project]
name = "quantilica-cli"
version = "0.3.2"
description = "Unified CLI for Quantilica open data fetchers"
readme = "README.md"
authors = [{ name = "Komesu, D.K.", email = "daniel@dkko.me" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["quantilica", "cli", "open-data", "brazil"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Typing :: Typed",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "quantilica-core>=0.4.0",
    "rich>=13.0.0",
    "typer>=0.15.0",
]

[project.scripts]
quantilica = "quantilica.cli.cli:main"

[dependency-groups]
dev = ["ruff>=0.9.0", "pytest>=8.0.0"]

# Os fetchers são instalados independentemente pelo usuário — quantilica-cli
# os descobre via entry points (grupo "quantilica.fetchers") sem dependência direta.
# Exemplo de instalação local para desenvolvimento:
#   uv pip install -e ../comex-fetcher ../rtn-fetcher ...

# Para desenvolvimento local do quantilica-core em conjunto com o CLI:
# cd quantilica-cli && uv pip install -e ../quantilica-core (sem [tool.uv.sources])
# Em produção, quantilica-core resolve pelo PyPI (pin de registro em dependencies).

# [tool.hatch.metadata]
# allow-direct-references = true

[tool.hatch.build.targets.wheel]
sources = ["src"]
packages = ["src/quantilica"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/quantilica/cli/sources.py" = ["E501"]
"src/quantilica/cli/cli.py" = ["E501"]
"src/quantilica/cli/sdk.py" = ["E501"]
"tests/*" = ["E501"]
